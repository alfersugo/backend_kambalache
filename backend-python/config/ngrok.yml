## ngrok configuration for SMTP-POSIX
## Expone el puerto 8080 (nginx reverse proxy) externamente via ngrok
## NUNCA exponer directamente puertos 3000 (PostgREST), 3050 (Python), 4050 (Bun)
##
## Uso: ngrok start smtp-posix --config backend/config/ngrok.yml
## Requisito: ngrok authtoken configurado (ngrok config add-authtoken <TOKEN>)

version: "3"
# Autenticación: agregar con: ngrok config add-authtoken <YOUR_TOKEN>
# Token almacenado en ~/.config/ngrok/ngrok.yml (fuera del repo)
tunnels:
    smtp-posix:
        proto: http
        addr: 8080
        # Opciones recomendadas (requieren plan ngrok):
        # domain: smtp-posix.ngrok-free.app   # dominio estático (plan free con cuenta)
        # inspect: true                        # activar inspector web en :4040
        schemes:
            - https # Solo HTTPS externo (ngrok hace TLS termination)
agent:
    authtoken: 3BBlN6MxVOjx390eeRtZS6IdGyW_73anhY55ggTyU1ct5r7A
