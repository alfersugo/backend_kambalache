[pytest]
# TAREA TESTING: configuración base para ejecutar pruebas por capas.
testpaths = tests
python_files = test_*.py
markers =
    integration: pruebas de integración con PostgreSQL
    e2e: pruebas extremo a extremo contra PostgREST y servicios
    graphql: pruebas de endpoint GraphQL y pg_graphql
    security: pruebas de seguridad/autorización
    superset: pruebas de conectividad y funcionalidad de Superset
    age: pruebas de Apache AGE (validación, implementación y continuidad)
addopts = -q
timeout = 35
timeout_method = signal
