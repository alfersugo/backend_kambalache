# GOB-BACKEND-001.09: genera X-Request-ID si el cliente no lo envía
map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

# NGINX Proxy Template for JWT-secured Routing (SMTP-POSIX)
# Plantilla de proxy inverso con forwarding JWT por backend desacoplado.
# Variables requeridas: PROXY_PORT, LOG_PATH, PYTHON_BACKEND_HOST, PYTHON_BACKEND_PORT,
#   BUN_BACKEND_HOST, BUN_BACKEND_PORT, POSTGREST_HOST, POSTGREST_PORT, JWT_SECRET

server {
    listen 8080;  # ORCH-INFRA-HTTP2-03: dual-stack durante pruebas (HTTP/1.1 plano, retro-compatible)
    # ORCH-INFRA-HTTP2-03: TLS + HTTP/2 en 443 (sintaxis nginx >=1.25.1 'http2 on;',
    # NO el formato antiguo 'listen 443 ssl http2;' que esta deprecado en 1.30.x)
    listen 443 ssl;
    http2 on;
    # ORCH-INFRA-HTTP2-03: cert self-signed espejo interno 10.0.0.11 (no habia TLS previo)
    ssl_certificate     /etc/pki/tls/certs/kambalache_10.0.0.11.crt;
    ssl_certificate_key /etc/pki/tls/private/kambalache_10.0.0.11.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_http2:10m;
    ssl_session_timeout 1h;

    server_name _;
    location = / {
        absolute_redirect off;
        return 302 /webapp/index.html;
    }

    access_log /var/log/nginx/proxy_smtp_posix.log;
    error_log  /var/log/nginx/proxy_smtp_posix.log warn;

    # ── Backend Python FastAPI (CU001/007-017) ─────────────────────────────
    # Desacoplado de Bun. /api/python/ → 127.0.0.1:3050
    # webapp-nostore: dist se actualiza con mismo filename; evitar stale cache
    location = /webapp/index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Resource-Policy same-origin;
        root /srv;
    }  # COOPv1
    location ~ ^/webapp/(webApp\.js|skiko\.mjs|skikod8\.mjs|skiko\.wasm) {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Resource-Policy same-origin;
        root /srv;
    }  # COOPv2
    location /webapp/ {
        # Compose wasm requiere: MIME correcto + aislamiento cross-origin
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Resource-Policy same-origin;
        include /etc/nginx/mime.types;
        types {
            application/wasm wasm;
            application/javascript mjs;
        }
        root /srv;
        try_files $uri $uri/ /webapp/index.html;
    }
    location /api/python/ {
        proxy_pass http://127.0.0.1:3050/api/python/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID       $req_id;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        access_log  /var/log/nginx/python_access.log;
        error_log   /var/log/nginx/python_error.log;
    }

    # ── Zero-buffer streaming: SSE realtime JWT-secured ────────────────────
    # ORCH-INFRA-HTTP2-03: proxy_buffering off = zero-buffer; los chunks del
    # event-stream se entregan al cliente a medida que llegan (sin retardo por
    # buffer de nginx). Debe preceder a location /api/bun/ (match exacto).
    location = /api/bun/eventos/sse {
        proxy_pass http://127.0.0.1:4050/api/bun/eventos/sse;
        proxy_buffering off;          # ORCH-INFRA-HTTP2-03: zero-buffer streaming
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID       $req_id;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 24h;       # SSE long-lived
        proxy_connect_timeout 10s;
        access_log  /var/log/nginx/bun_access.log;
        error_log   /var/log/nginx/bun_error.log;
    }

    # ── Backend Bun (catalog público, JWT verify, SSE) ─────────────────────
    # Desacoplado de Python. /api/bun/ → 127.0.0.1:4050
    location /api/bun/ {
        proxy_pass http://127.0.0.1:4050/api/bun/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID       $req_id;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        access_log  /var/log/nginx/bun_access.log;
        error_log   /var/log/nginx/bun_error.log;
    }

    # ── PostgREST RPC ──────────────────────────────────────────────────────
    location /rpc/ {
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        proxy_pass http://127.0.0.1:3000/rpc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID       $req_id;
        proxy_set_header Authorization $http_authorization;
        access_log  /var/log/nginx/postgrest_access.log;
        error_log   /var/log/nginx/postgrest_error.log;
    }

    # ── PostgREST resources (API genérica) ─────────────────────────────────
    location /api/postgrest/ {
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID       $req_id;
        proxy_set_header Authorization $http_authorization;
    }

    # ── PostgREST fallback para /api/ (compatibilidad existente) ───────────
    location /api/ {
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # ── GraphQL ────────────────────────────────────────────────────────────
    location /graphql {
        proxy_pass http://127.0.0.1:3000/graphql;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    # JWT auth_request (ADR-002): valida via Bun /api/bun/auth/verify
    include /etc/nginx/jwt_auth_request.inc;
}
